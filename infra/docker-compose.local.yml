name: inlet

x-healthcheck-defaults: &hc
  interval: 3s
  timeout: 3s
  retries: 40

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inlet
      POSTGRES_PASSWORD: inlet
      POSTGRES_DB: inlet
    ports:
      - "127.0.0.1:${INLET_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U inlet -d inlet"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${INLET_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *hc
      test: ["CMD", "redis-cli", "ping"]

  mailpit:
    image: ${SANDBOX_SINK_IMAGE:-axllent/mailpit:v1.27}
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks: [default, fixtures]
    healthcheck:
      <<: *hc
      test: ["CMD", "/mailpit", "readyz"]

  fixture-host:
    build:
      context: ..
      dockerfile: infra/runner-images/fixture-host.Dockerfile
    environment:
      FIXTURE_CONTROL_TOKEN: ${FIXTURE_CONTROL_TOKEN:?run pnpm setup:env}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:3110:3110"
      - "127.0.0.1:3111:3111"
      - "127.0.0.1:3112:3112"
      - "127.0.0.1:3113:3113"
      - "127.0.0.1:3190:3190"
    volumes:
      - fixture-data:/data
    depends_on:
      mailpit:
        condition: service_healthy
    networks:
      default: {}
      fixtures:
        aliases:
          - healthy.acme-demo.test
          - broken.acme-demo.test
          - demo-broken.acme-demo.test
          - attack.acme-demo.test
    healthcheck:
      <<: *hc
      retries: 60
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3190/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"

  egress-gateway:
    build:
      context: ../infra/egress-gateway
    environment:
      EGRESS_CONTROL_TOKEN: ${EGRESS_CONTROL_TOKEN:?run pnpm setup:env}
      SANDBOX_EGRESS_PROFILE: ${SANDBOX_EGRESS_PROFILE:-fixture-only}
      SANDBOX_SUBNET_PREFIX: "172.30."
      FIXTURE_DOMAIN_SUFFIX: ".acme-demo.test"
      PROXY_PORT: "3128"
      CONTROL_PORT: "3191"
    ports:
      - "127.0.0.1:3191:3191"
    depends_on:
      fixture-host:
        condition: service_healthy
    networks:
      sandbox:
        ipv4_address: 172.30.0.2
      fixtures: {}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      <<: *hc
      test: ["CMD", "node", "/app/healthcheck.mjs"]

  runner-browser:
    profiles: [images]
    image: ${SANDBOX_BROWSER_IMAGE:-inlet-runner-browser:local}
    build:
      context: ..
      dockerfile: infra/runner-images/browser.Dockerfile

  runner-repair:
    profiles: [images]
    image: ${SANDBOX_REPAIR_IMAGE:-inlet-runner-repair:local}
    build:
      context: ..
      dockerfile: infra/runner-images/repair.Dockerfile

networks:
  default:
    name: inlet-control
  fixtures:
    name: inlet-fixtures
  sandbox:
    name: inlet-sandbox
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  postgres-data:
  redis-data:
  fixture-data:
